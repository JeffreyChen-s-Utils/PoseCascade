name: Build wheels & release

# One workflow handles the whole release chain on every push to ``main``:
# compute next version → build wheels (matrix) → build sdist → PyPI
# publish → build Nuitka .exe → tag the commit + create the GitHub
# Release with the .exe attached. Doing everything inside a single
# workflow run sidesteps GitHub Actions' anti-recursion rule that
# blocks workflow triggers from GITHUB_TOKEN pushes — no PAT, no
# manual setup, the default token is enough.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "posecascade/animation/_cloth_kernels.pyx"
      - "setup.py"
      - "pyproject.toml"
      - ".github/workflows/wheels.yml"
  workflow_dispatch:

permissions:
  contents: write     # tag_and_release pushes the tag + creates a Release
  id-token: write     # publish uses PyPI Trusted Publishing (OIDC)

jobs:
  # ---------------------------------------------------------------------
  # compute_version: pick the next v* tag from the most recent one.
  # Only runs on push-to-main; PR / tag / dispatch paths build from
  # whatever version setuptools-scm derives from the existing repo
  # state (the tag itself for tag pushes, fallback_version for PRs).
  # ---------------------------------------------------------------------
  compute_version:
    if: |
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && !contains(github.event.head_commit.message, '[skip release]')
      && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full tag history
      - id: v
        shell: bash
        # The commit message is passed through an env var, not
        # interpolated into the script body. ``${{ github.event.* }}``
        # expressions are baked into the shell text at workflow
        # render time, so a commit subject containing single quotes
        # (or worse, ``'; rm -rf /; '``) would break out of the
        # ``msg='...'`` assignment and execute arbitrary code on the
        # runner. Routing the value through env (which goes through
        # GitHub Actions' standard string-passing path, not shell
        # parsing) closes that injection sink — flagged by SonarCloud
        # as a Security Hotspot on the previous workflow design.
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [[ -z "$latest" ]]; then
            next="0.0.1"
            echo "No previous tag; starting at v$next"
          else
            current="${latest#v}"
            IFS='.' read -r major minor patch <<< "$current"
            major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}
            if printf '%s' "$COMMIT_MSG" | grep -qiE '\[release[[:space:]]+major\]'; then
              major=$((major + 1)); minor=0; patch=0
              bump="major"
            elif printf '%s' "$COMMIT_MSG" | grep -qiE '\[release[[:space:]]+minor\]'; then
              minor=$((minor + 1)); patch=0
              bump="minor"
            else
              patch=$((patch + 1))
              bump="patch"
            fi
            next="${major}.${minor}.${patch}"
            echo "Previous tag: v$current → bump $bump → v$next"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # build_wheels: cibuildwheel across the OS × Python matrix.
  # ---------------------------------------------------------------------
  build_wheels:
    needs: compute_version
    # ``always()`` so the job still runs when compute_version was
    # skipped (PR / tag-push / dispatch); the result branch covers
    # the "compute_version succeeded" case for push-to-main.
    if: |
      always()
      && (needs.compute_version.result == 'success'
          || needs.compute_version.result == 'skipped')
    name: ${{ matrix.os }} / cp${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["312", "313", "314"]
        exclude:
          - { os: macos-latest, python: "312" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_BUILD: cp${{ matrix.python }}-*
          # On push-to-main, compute_version drives the wheel
          # version through setuptools-scm's pretend-version env
          # var. On tag pushes / PRs / dispatch, the env value is
          # empty and setuptools-scm falls back to its normal
          # tag-or-fallback behaviour.
          CIBW_ENVIRONMENT: |
            SETUPTOOLS_SCM_PRETEND_VERSION=${{ needs.compute_version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-cp${{ matrix.python }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # build_sdist: source distribution (same version logic).
  # ---------------------------------------------------------------------
  build_sdist:
    needs: compute_version
    if: |
      always()
      && (needs.compute_version.result == 'success'
          || needs.compute_version.result == 'skipped')
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # setuptools-scm reads tag history
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - name: Build sdist
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.compute_version.outputs.version }}
        run: |
          pip install build
          python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # publish: upload wheels + sdist to PyPI via Trusted Publishing.
  # ---------------------------------------------------------------------
  publish:
    needs: [compute_version, build_wheels, build_sdist]
    # Run on push-to-main (compute_version success) or on tag pushes.
    if: |
      always()
      && needs.build_wheels.result == 'success'
      && needs.build_sdist.result == 'success'
      && (needs.compute_version.result == 'success'
          || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/posecascade
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ---------------------------------------------------------------------
  # build_exe: Nuitka --onefile Windows .exe with the same version.
  # ---------------------------------------------------------------------
  build_exe:
    needs: [compute_version, publish]
    if: |
      always()
      && needs.publish.result == 'success'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - name: Install project + Nuitka toolchain
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.compute_version.outputs.version }}
        run: |
          pip install -e .
          pip install "nuitka>=2.5" ordered-set zstandard
      - name: Build the cloth Cython kernel in-place
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.compute_version.outputs.version }}
        run: python setup.py build_ext --inplace
      - name: Build with Nuitka
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.compute_version.outputs.version }}
        shell: bash
        run: |
          python -m nuitka \
            --standalone \
            --onefile \
            --assume-yes-for-downloads \
            --enable-plugin=pyside6 \
            --enable-plugin=numpy \
            --include-package=importers \
            --include-data-dir=shaders=shaders \
            --include-data-dir=schemas=schemas \
            --include-data-dir=importers=importers \
            --windows-disable-console \
            --output-dir=dist \
            --output-filename=PoseCascade \
            posecascade/__main__.py
      - uses: actions/upload-artifact@v4
        with:
          name: PoseCascade-exe
          path: dist/PoseCascade.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # tag_and_release: tag the source commit and create / update the
  # GitHub Release page with the .exe attached. Runs only when
  # publish succeeded AND we're on the push-to-main path (i.e.
  # compute_version produced a fresh version); tag-push reruns
  # skip this job since the tag already exists.
  # ---------------------------------------------------------------------
  tag_and_release:
    needs: [compute_version, publish, build_exe]
    if: |
      always()
      && needs.publish.result == 'success'
      && needs.compute_version.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag the source commit
        env:
          TAG: ${{ needs.compute_version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
      - uses: actions/download-artifact@v4
        with:
          name: PoseCascade-exe
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.compute_version.outputs.tag }}
          name: PoseCascade ${{ needs.compute_version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Install

            **Python package** (recommended for most users):

            ```bash
            pip install posecascade
            ```

            Wheels for cp312 / cp313 / cp314 × Win / macOS / Linux
            are on [PyPI](https://pypi.org/p/posecascade).

            **Standalone Windows executable** (no Python install
            required): `PoseCascade.exe` attached below. Built with
            Nuitka `--onefile`; the binary self-extracts to a temp
            directory on first launch.
          files: release-assets/PoseCascade.exe
