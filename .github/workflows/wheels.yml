name: Build wheels

# Triggers:
#   - On a release tag (``v*``) — full matrix, then upload the wheel +
#     sdist as release artefacts (uncomment the PyPI publish step once
#     you've configured the ``PYPI_API_TOKEN`` repo secret).
#   - On workflow_dispatch — manual run for sanity-checking the matrix.
#   - On PR — only Linux × cp314 so the build doesn't blow CI minutes;
#     macOS / Windows / older Pythons are covered on release.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'posecascade/animation/_cloth_kernels.pyx'
      - 'setup.py'
      - 'pyproject.toml'
      - '.github/workflows/wheels.yml'
  workflow_dispatch:

jobs:
  build_wheels:
    name: ${{ matrix.os }} / cp${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Release builds: full matrix. PR builds: linux × cp314 only.
        # The `include` keys are chosen so `if: github.event_name == 'pull_request'`
        # cuts the matrix down without duplicating the list.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['312', '313', '314']
        exclude:
          - { os: macos-latest, python: '312' }   # macOS runners are scarce; skip oldest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_BUILD: cp${{ matrix.python }}-*

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-cp${{ matrix.python }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    # Auto-publishes to PyPI on every tag-push (``release.yml`` creates
    # the tag on push-to-main; this job picks it up). Uses PyPI
    # Trusted Publishing — no API token is stored in repo secrets.
    # See ``docs/release_pipeline.md`` for the one-time PyPI side
    # configuration (project → Publishing → Add → GitHub).
    needs: [build_wheels, build_sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/posecascade
    permissions:
      id-token: write   # trusted publishing — no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  build_exe:
    # Once the PyPI publish has succeeded, compile a standalone
    # Nuitka --onefile Windows executable and attach it to the
    # GitHub Release the next job creates. PyPI is the authoritative
    # distribution path for the Python package; the .exe is the
    # bonus for users who don't want a Python install. The
    # dependency on ``publish`` ensures that if PyPI rejects the
    # upload (transient network failure, token mismatch), we don't
    # produce a GitHub Release that points at a non-existent PyPI
    # version.
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install project + Nuitka toolchain
        # ``ordered-set`` speeds Nuitka's symbol bookkeeping; Nuitka
        # warns on startup if missing. ``zstandard`` is the codec for
        # ``--onefile`` mode.
        run: |
          pip install -e .
          pip install "nuitka>=2.5" ordered-set zstandard

      - name: Build the cloth Cython kernel in-place
        # Nuitka's standalone discovery picks up the compiled .pyd
        # sitting next to _cloth_kernels.pyx — without this step the
        # bundle silently falls back to the slower NumPy path.
        run: python setup.py build_ext --inplace

      - name: Build with Nuitka
        shell: bash
        run: |
          python -m nuitka \
            --standalone \
            --onefile \
            --assume-yes-for-downloads \
            --enable-plugin=pyside6 \
            --enable-plugin=numpy \
            --include-package=importers \
            --include-data-dir=shaders=shaders \
            --include-data-dir=schemas=schemas \
            --include-data-dir=importers=importers \
            --windows-disable-console \
            --output-dir=dist \
            --output-filename=PoseCascade \
            posecascade/__main__.py

      - uses: actions/upload-artifact@v4
        with:
          name: PoseCascade-exe
          path: dist/PoseCascade.exe
          if-no-files-found: error

  github_release:
    # Final step: create (or update) the GitHub Release for this tag
    # and attach the Nuitka executable. The Python package itself
    # has already been published to PyPI by the ``publish`` job; we
    # only attach the binary here so the release page doesn't
    # duplicate the wheel files that are one ``pip install`` away.
    needs: [publish, build_exe]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # softprops/action-gh-release needs this to push the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PoseCascade-exe
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PoseCascade ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Install

            **Python package** (recommended for most users):

            ```bash
            pip install posecascade
            ```

            Wheels for cp312 / cp313 / cp314 × Win / macOS / Linux
            are on [PyPI](https://pypi.org/p/posecascade).

            **Standalone Windows executable** (no Python install
            required): `PoseCascade.exe` attached below. Built with
            Nuitka `--onefile`; the binary self-extracts to a temp
            directory on first launch.

            See
            [`docs/packaging_nuitka.md`](https://github.com/JeffreyChen-s-Utils/PoseCascade/blob/main/docs/packaging_nuitka.md)
            for how the binary is produced.
          files: |
            release-assets/PoseCascade.exe
