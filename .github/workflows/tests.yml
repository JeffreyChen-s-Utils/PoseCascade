name: Tests

# Runs on every pull request and every push to ``main``. Three jobs:
#
# * ``lint`` — ``ruff check`` over the whole tree. Fast (~5 s).
# * ``security`` — ``bandit`` over ``posecascade/`` with the project's
#   skip config. Also fast.
# * ``test`` — the full pytest suite under Linux + Python 3.12 / 3.13 /
#   3.14. Uses Qt's ``offscreen`` platform plugin (via the
#   ``QT_QPA_PLATFORM`` env var) so ``QApplication`` constructs
#   without needing a real display, and GL-dependent tests skip
#   cleanly when the offscreen plugin can't provide a working GL
#   context. Cython kernel is compiled in-place by
#   ``pip install -e .[dev,ai]``.
#
# Windows / macOS test runs are intentionally out of scope here —
# ``wheels.yml`` already builds + smoke-tests one wheel per OS on
# release; the per-PR cost of three OSes × three Pythons would slow
# everything down for a marginal coverage gain.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install ruff
        run: pip install "ruff>=0.6"
      - name: Run ruff
        run: python -m ruff check .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install bandit
        run: pip install "bandit>=1.7"
      - name: Run bandit
        # The ``-c pyproject.toml`` flag is REQUIRED — without it bandit
        # ignores the project skip config and the run goes noisy.
        run: python -m bandit -c pyproject.toml -r posecascade/

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system libs for Qt + offscreen GL
        # Qt 6.7+ on Linux dynamically resolves these even with the
        # ``offscreen`` plugin: ``libegl1`` / ``libgl1`` back
        # ``QOffscreenSurface`` + ``QOpenGLContext``, ``libfontconfig1``
        # / ``libfreetype6`` keep ``QFontDatabase`` from issuing
        # ``qFatal`` on first ``QApplication`` instantiation,
        # ``libxkbcommon0`` is referenced by every Qt platform plugin
        # (offscreen included), and ``libdbus-1-3`` is hard-wired to
        # ``QGuiApplicationPrivate`` initialisation.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libfreetype6
      - name: Install project (editable + dev extras)
        run: pip install -e ".[dev,ai]"
      - name: Run pytest
        # ``QT_QPA_PLATFORM=offscreen`` avoids the xcb plugin entirely
        # — the failure mode "Fatal Python error: Aborted" inside
        # ``QApplication([])`` is xcb's ``qFatal`` after it fails to
        # connect to the (non-existent) display. ``offscreen`` needs
        # no display at all and still backs ``QOffscreenSurface`` +
        # ``QOpenGLContext`` so the GL fixtures keep working where
        # the platform supports them (or skip cleanly where it
        # doesn't). Test_export_video is excluded because ffmpeg
        # isn't installed by default on Ubuntu runners; the engine
        # itself never depends on ffmpeg, only that one test does.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/ -q \
            --ignore=tests/test_export_video.py
