[build-system]
requires = [
    "setuptools>=68",
    "setuptools-scm>=8",
    "wheel",
    "Cython>=3.0",
    "numpy>=1.26",
]
build-backend = "setuptools.build_meta"

[project]
name = "posecascade"
# Version is derived from the most recent git tag via setuptools-scm
# (see [tool.setuptools_scm] below). The release workflow tags
# ``vMAJOR.MINOR.PATCH`` on every push to main and that tag becomes
# the wheel's version. Local non-tag builds fall back to
# ``0.0.0.dev{commit-count}+g{sha}`` so a developer install still
# advertises a unique version.
dynamic = ["version"]
description = "PySide6 + OpenGL engine for importing 3D models and driving them with sandboxed scripts."
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "PyOpenGL>=3.1.7",
    "numpy>=1.26",
    "Pillow>=10.0",
    "defusedxml>=0.7",
    "pygltflib>=1.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "bandit>=1.7",
    "scikit-image>=0.24",
]
# ``ai`` ships the Model Context Protocol server + its dependencies so
# MCP-aware LLM agents can drive the engine. Install with
# ``pip install -e .[ai]`` — then the ``posecascade-mcp`` console
# script lands on PATH and ``.mcp.json`` lights up automatically.
ai = [
    "mcp>=1.0",
    "jsonschema>=4.0",
]

[project.scripts]
posecascade = "posecascade.__main__:main"
posecascade-mcp = "posecascade.mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["posecascade*"]
exclude = ["tests*", "importers*", "examples*"]

[tool.setuptools_scm]
# Tag format: ``vMAJOR.MINOR.PATCH``. ``fallback_version`` is used when
# the source tree has no git metadata (sdist installs, ``pip install``
# directly from GitHub on a non-tag SHA). ``local_scheme = no-local-version``
# keeps PEP 440-compliant versions on PyPI — TestPyPI / PyPI reject the
# ``+gSHA`` local segment setuptools-scm produces by default for
# non-tag builds.
fallback_version = "0.0.0"
local_scheme = "no-local-version"

# cibuildwheel: build wheels in CI for Win/macOS/Linux × supported Pythons.
# The job is wired up in ``.github/workflows/wheels.yml`` (see that file
# for the matrix). Locally, ``pip wheel .`` already produces a wheel for
# the host platform via setup.py's cythonize step.
[tool.cibuildwheel]
# Skip 32-bit + PyPy + EOL CPythons — Cython kernels need a working
# numpy ABI and the build matrix gets exponentially uglier with rarely-
# used targets.
build = "cp312-* cp313-* cp314-*"
skip = ["*-musllinux_*", "pp*", "*_i686", "*-win32"]
# Run the test suite inside the temporary wheel install before
# publishing, so we ship a wheel where the kernel actually loads.
test-requires = ["pytest", "pytest-qt"]
test-command = "pytest {project}/tests/test_cloth_cython_kernel.py -q"
test-skip = "*-macosx_*"  # Qt offscreen + GL fixtures are flaky on macOS runners

[tool.cibuildwheel.linux]
# Cython kernels need numpy headers at compile time; the manylinux image
# pulls numpy from PyPI per Python so each wheel is built against the
# matching numpy ABI. Use TOML literal-string syntax (single-quoted)
# so the embedded double-quotes round-trip into the actual shell
# command — Windows cmd.exe interprets single quotes as literal
# characters and treats ``>=`` as a stream redirect, which is why
# the previous form failed there with "Process exit code 1" in the
# ``before_build`` cibuildwheel stage.
before-build = 'pip install "numpy>=1.26" "Cython>=3.0"'

[tool.cibuildwheel.macos]
before-build = 'pip install "numpy>=1.26" "Cython>=3.0"'

[tool.cibuildwheel.windows]
before-build = 'pip install "numpy>=1.26" "Cython>=3.0"'

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "B",           # flake8-bugbear
    "I",           # isort
    "UP",          # pyupgrade
    "SIM",         # flake8-simplify
    "S",           # flake8-bandit (subset)
    "N",           # pep8-naming
    "C4",          # comprehensions
    "RET",         # return-statements
    "PL",          # pylint
]
ignore = [
    "PLR0913",     # too-many-arguments — handled at the dataclass-grouping level case-by-case
    "S101",        # asserts in tests are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR2004", "PLR0913"]
"posecascade/scripting/sandbox.py" = ["S102"]   # one allowed exec, gated; bandit nosec on the line

[tool.bandit]
# Mirror of .bandit — keep in sync. The .bandit file is canonical and carries
# per-rule justification comments.
exclude_dirs = ["tests", ".venv", "build", "dist"]
skips = []  # add only with a same-line justification in .bandit
