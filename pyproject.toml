[build-system]
requires = ["setuptools>=68", "wheel", "Cython>=3.0", "numpy>=1.26"]
build-backend = "setuptools.build_meta"

[project]
name = "posecascade"
version = "0.0.1"
description = "PySide6 + OpenGL engine for importing 3D models and driving them with sandboxed scripts."
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "PyOpenGL>=3.1.7",
    "numpy>=1.26",
    "Pillow>=10.0",
    "defusedxml>=0.7",
    "pygltflib>=1.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "bandit>=1.7",
    "scikit-image>=0.24",
]
# ``ai`` ships the Model Context Protocol server + its dependencies so
# MCP-aware LLM agents can drive the engine. Install with
# ``pip install -e .[ai]`` — then the ``posecascade-mcp`` console
# script lands on PATH and ``.mcp.json`` lights up automatically.
ai = [
    "mcp>=1.0",
    "jsonschema>=4.0",
]

[project.scripts]
posecascade = "posecascade.__main__:main"
posecascade-mcp = "posecascade.mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["posecascade*"]
exclude = ["tests*", "importers*", "examples*"]

# cibuildwheel: build wheels in CI for Win/macOS/Linux × supported Pythons.
# The job is wired up in ``.github/workflows/wheels.yml`` (see that file
# for the matrix). Locally, ``pip wheel .`` already produces a wheel for
# the host platform via setup.py's cythonize step.
[tool.cibuildwheel]
# Skip 32-bit + PyPy + EOL CPythons — Cython kernels need a working
# numpy ABI and the build matrix gets exponentially uglier with rarely-
# used targets.
build = "cp312-* cp313-* cp314-*"
skip = ["*-musllinux_*", "pp*", "*_i686", "*-win32"]
# Run the test suite inside the temporary wheel install before
# publishing, so we ship a wheel where the kernel actually loads.
test-requires = ["pytest", "pytest-qt"]
test-command = "pytest {project}/tests/test_cloth_cython_kernel.py -q"
test-skip = "*-macosx_*"  # Qt offscreen + GL fixtures are flaky on macOS runners

[tool.cibuildwheel.linux]
# Cython kernels need numpy headers at compile time; the manylinux image
# pulls numpy from PyPI per Python so each wheel is built against the
# matching numpy ABI.
before-build = "pip install 'numpy>=1.26' 'Cython>=3.0'"

[tool.cibuildwheel.macos]
before-build = "pip install 'numpy>=1.26' 'Cython>=3.0'"

[tool.cibuildwheel.windows]
before-build = "pip install 'numpy>=1.26' 'Cython>=3.0'"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "B",           # flake8-bugbear
    "I",           # isort
    "UP",          # pyupgrade
    "SIM",         # flake8-simplify
    "S",           # flake8-bandit (subset)
    "N",           # pep8-naming
    "C4",          # comprehensions
    "RET",         # return-statements
    "PL",          # pylint
]
ignore = [
    "PLR0913",     # too-many-arguments — handled at the dataclass-grouping level case-by-case
    "S101",        # asserts in tests are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR2004", "PLR0913"]
"posecascade/scripting/sandbox.py" = ["S102"]   # one allowed exec, gated; bandit nosec on the line

[tool.bandit]
# Mirror of .bandit — keep in sync. The .bandit file is canonical and carries
# per-rule justification comments.
exclude_dirs = ["tests", ".venv", "build", "dist"]
skips = []  # add only with a same-line justification in .bandit
