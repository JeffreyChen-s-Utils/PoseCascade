name = "o_greener"
fragment_shader = "shaders/effects/o_greener.frag"
output_name = "result"
blend_mode = "replace"
description = """
o_Greener-style colour grading: hue / saturation / contrast / lift /
gamma sliders for cinematic looks. Operates on ``main_color`` only;
no depth or auxiliary buffer access.
"""

[[inputs]]
sampler_name = "u_main_color"
source = "main_color"

[[uniforms]]
name = "hue_shift_degrees"
kind = "scalar"
default = 0.0
minimum = -180.0
maximum = 180.0
step = 1.0
description = "Hue rotation in degrees."

[[uniforms]]
name = "saturation"
kind = "scalar"
default = 1.0
minimum = 0.0
maximum = 2.0
step = 0.01
description = "1.0 keeps original saturation; 0.0 desaturates."

[[uniforms]]
name = "contrast"
kind = "scalar"
default = 1.0
minimum = 0.5
maximum = 2.0
step = 0.01
description = "Symmetric contrast around mid-grey."

[[uniforms]]
name = "lift"
kind = "vec3_color"
default = [0.0, 0.0, 0.0]
description = "Per-channel offset added to the final colour."
