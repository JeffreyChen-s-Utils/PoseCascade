name = "autoluminous"
fragment_shader = "shaders/effects/autoluminous.frag"
output_name = "result"
blend_mode = "add"
description = """
AutoLuminous-style emissive bloom. Samples ``main_color``, isolates the
high-luminance band above ``threshold``, blurs it via a Gaussian and
adds the result back onto the scene scaled by ``intensity``.
"""

[[inputs]]
sampler_name = "u_main_color"
source = "main_color"

[[uniforms]]
name = "threshold"
kind = "scalar"
default = 0.85
minimum = 0.0
maximum = 1.5
step = 0.01
description = "Luminance value above which a pixel contributes to bloom."

[[uniforms]]
name = "intensity"
kind = "scalar"
default = 1.0
minimum = 0.0
maximum = 4.0
step = 0.05
description = "Scale on the final bloom contribution before adding back."

[[uniforms]]
name = "tint"
kind = "vec3_color"
default = [1.0, 1.0, 1.0]
description = "Per-channel multiplier applied to the bloom output."
