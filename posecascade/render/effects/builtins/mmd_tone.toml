name = "mmd_tone"
fragment_shader = "shaders/effects/mmd_tone.frag"
output_name = "result"
blend_mode = "replace"
description = """
MMD-style gamma curve approximation: midtone lift + soft highlight
rolloff + gentle saturation boost + warm tint. Designed to push a
calibrated-sRGB render toward the slightly warmer, slightly lifted
look MMD's non-standard colour pipeline produces. Stack after
AutoLuminous for the canonical MMD-look post chain.
"""

[[inputs]]
sampler_name = "u_main_color"
source = "main_color"

[[uniforms]]
name = "midtone_lift"
kind = "scalar"
default = 0.04
minimum = 0.0
maximum = 0.2
step = 0.01
description = "Floor under deep shadow — 0 keeps blacks at 0, 0.04 matches MMD's grey-shadow feel."

[[uniforms]]
name = "highlight_rolloff"
kind = "scalar"
default = 0.15
minimum = 0.0
maximum = 0.6
step = 0.01
description = "Width of the Reinhard-style soft-knee at the high end."

[[uniforms]]
name = "saturation"
kind = "scalar"
default = 1.08
minimum = 0.0
maximum = 2.0
step = 0.02
description = "1 = neutral, > 1 boosts colour, < 1 desaturates."

[[uniforms]]
name = "warm_tint"
kind = "vec3_color"
default = [1.02, 1.0, 0.97]
description = "Multiplicative bias on the final RGB — leave near (1, 1, 1) for neutral."
